basePath: /
definitions:
  api.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  api.Problem:
    properties:
      detail:
        description: Explicação específica desta ocorrência
        type: string
      errors:
        description: 'Extensão: erros por campo (validação)'
        items:
          $ref: '#/definitions/api.FieldError'
        type: array
      instance:
        description: 'URI que identifica a ocorrência (ex: path da requisição)'
        type: string
      status:
        description: Código HTTP
        type: integer
      title:
        description: Resumo legível do tipo
        type: string
      type:
        description: URI reference que identifica o tipo do problema
        type: string
    type: object
  controllers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  controllers.PatchMeRequest:
    properties:
      cellphone:
        type: string
      date_birth:
        description: ISO date "2006-01-02"
        type: string
      email_verified:
        type: boolean
      goal_id:
        type: string
      height:
        type: number
      profile_img:
        description: base64
        type: string
      weight:
        type: number
    type: object
  controllers.RegisterRequest:
    properties:
      cellphone:
        type: string
      email:
        type: string
      full_name:
        type: string
      gender:
        type: string
      goal_id:
        type: string
      password:
        type: string
      tax_id:
        type: string
    type: object
  controllers.SubscribeRequest:
    properties:
      completion_url:
        type: string
      product_id:
        type: string
      return_url:
        type: string
    type: object
  models.Goal:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      external_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      cellphone:
        type: string
      created_at:
        type: string
      date_birth:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      gender:
        type: string
      goal_id:
        type: string
      height:
        type: number
      id:
        type: string
      is_active:
        type: boolean
      last_login_at:
        type: string
      profile_img:
        type: string
      tax_id:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  services.CheckPixStatusOutput:
    properties:
      expires_at:
        type: string
      status:
        description: PENDING, EXPIRED, CANCELLED, PAID, REFUNDED
        type: string
    type: object
  services.CreateSubscriptionOutput:
    properties:
      billing_id:
        type: string
      payment_url:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'API da Rose Academy: auth, metas e integração Abacate Pay.'
  title: Rose Academy API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Valida email e senha; retorna usuário e JWT.
      parameters:
      - description: Credenciais (email e password)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Problem'
        "401":
          description: email ou senha inválidos
          schema:
            $ref: '#/definitions/api.Problem'
      summary: Login
      tags:
      - auth
  /auth/me:
    get:
      description: 'Retorna os dados do usuário autenticado. Requer header Authorization:
        Bearer &lt;token&gt;.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Problem'
      security:
      - BearerAuth: []
      summary: Usuário logado
      tags:
      - auth
    patch:
      consumes:
      - application/json
      description: Atualiza date_birth, weight, height, goal_id, profile_img, cellphone
        e/ou email_verified. Apenas campos enviados são alterados.
      parameters:
      - description: Campos a atualizar
        in: body
        name: body
        schema:
          $ref: '#/definitions/controllers.PatchMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Problem'
      security:
      - BearerAuth: []
      summary: Atualizar perfil
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Cadastra usuário no app e cria cliente na Abacate Pay. Retorna
        usuário e JWT.
      parameters:
      - description: Dados do cadastro
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Problem'
        "409":
          description: email ou CPF/CNPJ já cadastrado
          schema:
            $ref: '#/definitions/api.Problem'
        "503":
          description: Gateway não configurado
          schema:
            $ref: '#/definitions/api.Problem'
      summary: Criar usuário e cliente Abacate Pay
      tags:
      - auth
  /goals:
    get:
      description: Retorna todas as metas ativas (para formulário de cadastro, etc.).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Goal'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Problem'
      summary: Listar metas
      tags:
      - goals
  /health:
    get:
      description: Retorna status da API. Útil para load balancers e monitoramento.
      produces:
      - application/json
      responses:
        "200":
          description: 'Ex.: {\"status\":\"ok\"}'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /payments/pix/check:
    get:
      description: Consulta o status do pagamento do QR Code PIX (PENDING, EXPIRED,
        CANCELLED, PAID, REFUNDED). Ver [Checar Status](https://docs.abacatepay.com/pages/pix-qrcode/check).
      parameters:
      - description: ID do QR Code PIX
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.CheckPixStatusOutput'
        "400":
          description: id ausente
          schema:
            $ref: '#/definitions/api.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Problem'
        "503":
          description: Gateway não configurado
          schema:
            $ref: '#/definitions/api.Problem'
      security:
      - BearerAuth: []
      summary: Checar status PIX
      tags:
      - billing
  /products:
    get:
      description: 'Retorna os produtos/planos disponíveis para assinatura (ex.: Plano
        Anual, Plano Mensal).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Product'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar produtos
      tags:
      - products
  /subscribe:
    post:
      consumes:
      - application/json
      description: Cria uma cobrança para o usuário autenticado no plano escolhido.
        Retorna a URL para pagamento (PIX ou cartão).
      parameters:
      - description: product_id (UUID), return_url e completion_url
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.SubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.CreateSubscriptionOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assinar plano
      tags:
      - billing
  /webhooks/abacatepay:
    post:
      consumes:
      - application/json
      description: 'Endpoint para receber eventos da Abacate Pay (ex.: billing.paid).
        Configure a URL no dashboard com o secret.'
      parameters:
      - description: Secret configurado no dashboard
        in: query
        name: webhookSecret
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Webhook Abacate Pay
      tags:
      - billing
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
