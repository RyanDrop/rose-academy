definitions:
  controllers.AbacatePayWebhookEvent:
    properties:
      data:
        additionalProperties: true
        type: object
      devMode:
        type: boolean
      event:
        type: string
      id:
        type: string
    type: object
  controllers.AuthTokenResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  controllers.CancelSubscriptionRequest:
    properties:
      id:
        type: string
    type: object
  controllers.CreateAbacateSubscriptionCheckoutRequest:
    properties:
      abp_product_id:
        type: string
      completion_url:
        type: string
      methods:
        description: Assinatura v2 na Abacate aceita só CARD (PIX em conjunto gera
          erro na API).
        items:
          type: string
        type: array
      product_id:
        type: string
      return_url:
        type: string
    type: object
  controllers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  controllers.PatchMeRequest:
    properties:
      cellphone:
        type: string
      date_birth:
        description: ISO date "2006-01-02"
        type: string
      email_verified:
        type: boolean
      gender:
        description: feminino, masculino, outro, prefiro_nao_dizer; vazio remove
        type: string
      goal_id:
        type: string
      height:
        type: number
      profile_img:
        description: base64
        type: string
      tax_id:
        description: CPF/CNPJ (apenas dígitos gravados); string vazia remove
        type: string
      weight:
        type: number
    type: object
  controllers.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      tax_id:
        type: string
    type: object
  controllers.SubscribeRequest:
    properties:
      completion_url:
        type: string
      product_id:
        type: string
      return_url:
        type: string
    type: object
  controllers.SubscriptionActiveResponse:
    properties:
      status:
        description: Status PAID libera acesso; PENDING o front deve listar assinaturas
          e ir ao checkout; null sem assinatura relevante (local).
        type: string
    type: object
  controllers.WebhookAck:
    properties:
      received:
        type: boolean
    type: object
  models.Goal:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Product:
    properties:
      abacate_subscription_product_id:
        description: id do produto com ciclo na loja Abacate Pay (checkout v2)
        type: string
      created_at:
        type: string
      description:
        type: string
      external_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        type: integer
      updated_at:
        type: string
    type: object
  models.TrainingMonthPublic:
    properties:
      id:
        type: string
      month_number:
        type: integer
      subtitle:
        description: description no banco
        type: string
      title:
        type: string
    type: object
  models.TrainingPlanPublic:
    properties:
      id:
        type: string
      level:
        description: PT-BR canônico (Iniciante, Intermediário, Avançado) mesmo que
          o banco guarde sem acentos
        type: string
      months:
        items:
          $ref: '#/definitions/models.TrainingMonthPublic'
        type: array
      subtitle:
        type: string
      title:
        description: name
        type: string
    type: object
  models.User:
    properties:
      cellphone:
        type: string
      created_at:
        type: string
      date_birth:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      full_name:
        type: string
      gender:
        type: string
      goal_id:
        type: string
      height:
        type: number
      id:
        type: string
      is_active:
        type: boolean
      last_login_at:
        type: string
      profile_img:
        type: string
      tax_id:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  routes.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  services.CheckPixStatusOutput:
    properties:
      expires_at:
        type: string
      status:
        description: PENDING, EXPIRED, CANCELLED, PAID, REFUNDED
        type: string
    type: object
  services.CreateAbacateSubscriptionCheckoutOutput:
    properties:
      amount_cents:
        type: integer
      billing_id:
        type: string
      dev_mode:
        description: DevMode true quando a Abacate Pay cria o checkout em ambiente
          de testes (chave de API de dev/sandbox).
        type: boolean
      hint:
        description: Hint mensagem curta quando DevMode for relevante para achar o
          checkout no painel.
        type: string
      payment_url:
        type: string
      status:
        type: string
      user_subscription_id:
        description: UserSubscriptionID registro local em user_subscriptions (status
          PENDING até o webhook marcar pago).
        type: string
    type: object
  services.CreateSubscriptionOutput:
    properties:
      billing_id:
        type: string
      payment_url:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
paths:
  /abacate/subscriptions:
    get:
      parameters:
      - description: máximo de itens após filtros
        in: query
        name: limit
        type: integer
      - description: filtra por subs_*, bill_*, UUID local ou checkout_external_id
        in: query
        name: id
        type: string
      - description: checkout_external_id
        in: query
        name: externalId
        type: string
      - description: PENDING, PAID, ...
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar assinaturas (local)
      tags:
      - abacate-subscriptions
  /abacate/subscriptions/cancel:
    post:
      consumes:
      - application/json
      parameters:
      - description: id da assinatura (subs_...)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.CancelSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancelar assinatura Abacate Pay
      tags:
      - abacate-subscriptions
  /abacate/subscriptions/checkout:
    post:
      consumes:
      - application/json
      description: Cria checkout (POST /v2/subscriptions/create). Grava assinatura
        local PENDING; webhook marca PAID. Produto com ciclo na loja.
      parameters:
      - description: product_id, return_url, completion_url
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateAbacateSubscriptionCheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.CreateAbacateSubscriptionCheckoutOutput'
      security:
      - BearerAuth: []
      summary: Checkout assinatura Abacate Pay
      tags:
      - abacate-subscriptions
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: email e senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AuthTokenResponse'
        "400":
          description: validação
          schema:
            additionalProperties: true
            type: object
        "401":
          description: credenciais inválidas
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Perfil (me)
      tags:
      - auth
    patch:
      consumes:
      - application/json
      parameters:
      - description: campos opcionais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.PatchMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: validação
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: CPF/CNPJ em uso
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Atualizar perfil
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Cria conta com email, senha e nome completo; opcional tax_id (CPF/CNPJ,
        só dígitos no banco). Cliente na Abacate Pay; retorna JWT. Celular, meta e
        gênero em PATCH /auth/me.
      parameters:
      - description: email, password, full_name; opcional tax_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controllers.AuthTokenResponse'
        "400":
          description: validação
          schema:
            additionalProperties: true
            type: object
        "409":
          description: email ou CPF em uso
          schema:
            additionalProperties: true
            type: object
        "503":
          description: gateway de pagamento
          schema:
            additionalProperties: true
            type: object
      summary: Cadastro
      tags:
      - auth
  /goals:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Goal'
            type: array
      summary: Listar metas
      tags:
      - catalog
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.HealthResponse'
      summary: Health check
      tags:
      - system
  /payments/pix/check:
    get:
      parameters:
      - description: id do QR code na Abacate Pay
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.CheckPixStatusOutput'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Status PIX
      tags:
      - billing
  /products:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Product'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar produtos
      tags:
      - catalog
  /subscribe:
    post:
      consumes:
      - application/json
      description: Cria billing na Abacate Pay v1; após pagamento o webhook marca
        PAID
      parameters:
      - description: produto e URLs de retorno
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.SubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.CreateSubscriptionOutput'
        "400":
          description: validação ou cliente não vinculado
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: produto não encontrado
          schema:
            additionalProperties: true
            type: object
        "503":
          description: gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Assinar plano (cobrança única)
      tags:
      - billing
  /subscriptions/active:
    get:
      description: 'Prioridade: PAID > PENDING com base em user_subscriptions (user_id).
        null se não houver PAID nem PENDING. PENDING: front lista GET /abacate/subscriptions
        (local) e redireciona ao checkout.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.SubscriptionActiveResponse'
      security:
      - BearerAuth: []
      summary: Status da assinatura (local)
      tags:
      - subscriptions
  /training-plans:
    get:
      description: Retorna training_plans (is_active) e training_months (is_active);
        title=name, subtitle=description; level em PT-BR com acentos (Iniciante, Intermediário,
        Avançado) mesmo que o banco guarde sem acentos.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TrainingPlanPublic'
            type: array
      summary: Listar planos de treino com meses
      tags:
      - catalog
  /webhooks/abacatepay:
    post:
      consumes:
      - application/json
      description: 'Validação opcional: query webhookSecret = ABACATE_PAY_WEBHOOK_SECRET'
      parameters:
      - description: deve coincidir com ABACATE_PAY_WEBHOOK_SECRET se configurado
        in: query
        name: webhookSecret
        type: string
      - description: evento (ex. billing.paid)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.AbacatePayWebhookEvent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.WebhookAck'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Webhook Abacate Pay
      tags:
      - webhooks
swagger: "2.0"
